<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ஆரம்ப சுகாதார நிலையம் — Primary Health Centre Records</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent:        #0F6F6F;
      --ink:           #1A1F24;
      --ink-secondary: #5B6570;
      --bg:            #F4F6F7;
      --surface:       #FFFFFF;
      --border:        #E1E5E8;
      --urgent:        #B3261E;

      --font-en: 'Inter', sans-serif;
      --font-ta: 'Noto Sans Tamil', 'Inter', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-en);
      font-size: 16px;
      line-height: 1.5;
      overflow: hidden;
    }

    /* ── App shell ── */
    .records-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
    }

    /* ── Header — flat bar matching kiosk ── */
    .phc-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      border-radius: 0px;
      flex-shrink: 0;
      z-index: 10;
    }

    .phc-brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Cross emblem sits directly on header background without container shape */
    .phc-emblem {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      background: transparent;
      border: none;
      border-radius: 0px;
      flex-shrink: 0;
    }

    .phc-brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    /* PHC Name: 700 weight reserved exclusively */
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      font-family: var(--font-ta);
    }

    .brand-sub {
      font-size: 14px;
      font-weight: 400;
      color: var(--ink-secondary);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Unified Badge Pattern: small uppercase text + static dot marker */
    .live-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-secondary);
    }

    /* Static solid dot marker — NO pulsing/glowing animations */
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 4px;
      background: var(--accent);
      flex-shrink: 0;
    }

    .pulse-dot.paused {
      background: var(--urgent);
    }

    .record-count {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      border-left: 3px solid var(--accent);
      padding: 0 0 0 8px;
      line-height: 1;
    }

    /* Secondary Action: plain text, 1px border, 4px radius, no fill, no shadow */
    .btn-nav {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-secondary);
      background: transparent;
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 16px;
      transition: transform 0.1s ease;
    }

    .btn-nav:hover {
      color: var(--ink);
      border-color: var(--ink-secondary);
    }

    .btn-nav:active {
      transform: scale(0.98);
    }

    /* ══════════════════════════════════════════════
       WORKSPACE — two-column list-detail layout
       Containers have 0px radius (sharp)
    ══════════════════════════════════════════════ */
    .records-workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 0;
      overflow: hidden;
      border-radius: 0px;
    }

    /* ── LEFT: Token list panel ── */
    .token-list-panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--surface);
      border-radius: 0px;
      overflow: hidden;
    }

    .list-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      border-radius: 0px;
      flex-shrink: 0;
    }

    .list-panel-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-secondary);
    }

    .list-count-chip {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-secondary);
    }

    .token-list {
      flex: 1;
      overflow-y: auto;
      border-radius: 0px;
    }

    /* Token row — flat rows separated by a single 1px bottom border.
       No card components with gaps. Consistent row height.
       Selected state indicated by background tone shift only. */
    .token-row {
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-rows: auto auto;
      column-gap: 8px;
      row-gap: 8px;
      padding: 16px;
      border: none;
      border-bottom: 1px solid var(--border);
      border-left: 3px solid transparent;
      border-radius: 0px;
      background: var(--surface);
      width: 100%;
      text-align: left;
      cursor: pointer;
      font-family: var(--font-en);
      transition: transform 0.1s ease;
    }

    .token-row:active {
      transform: scale(0.98);
    }

    .token-row:hover {
      background: var(--bg);
    }

    .token-row.selected {
      background: var(--bg);
      border-left-color: var(--accent) !important;
    }

    .token-row.conf-high   { border-left-color: var(--accent); }
    .token-row.conf-medium { border-left-color: var(--ink-secondary); }
    .token-row.conf-low    { border-left-color: var(--urgent); }

    .row-id {
      grid-column: 1;
      grid-row: 1;
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
    }

    .row-time {
      grid-column: 2;
      grid-row: 1;
      font-size: 14px;
      font-weight: 400;
      color: var(--ink-secondary);
      text-align: right;
    }

    .row-complaint {
      grid-column: 1 / -1;
      grid-row: 2;
      font-size: 14px;
      font-weight: 400;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Empty state: plain, calm text only */
    .list-empty {
      padding: 32px 16px;
      font-size: 14px;
      font-weight: 400;
      color: var(--ink-secondary);
      text-align: center;
    }

    /* ── RIGHT: Detail panel ── */
    .detail-panel {
      overflow-y: auto;
      background: var(--bg);
      border-radius: 0px;
    }

    .detail-empty-state {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-secondary);
      font-size: 16px;
      font-weight: 400;
      padding: 32px;
      text-align: center;
    }

    .detail-content {
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Detail header row */
    .detail-header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      border-radius: 0px;
    }

    .detail-token {
      font-size: 20px;
      font-weight: 600;
      color: var(--ink);
    }

    /* Confidence: Unified badge pattern — text + solid dot prefix */
    .conf-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .conf-dot {
      width: 8px;
      height: 8px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .conf-label.high   { color: var(--accent); }
    .conf-label.high   .conf-dot { background: var(--accent); }
    .conf-label.medium { color: var(--ink-secondary); }
    .conf-label.medium .conf-dot { background: var(--ink-secondary); }
    .conf-label.low    { color: var(--urgent); }
    .conf-label.low    .conf-dot { background: var(--urgent); }

    .detail-timestamp {
      font-size: 14px;
      font-weight: 400;
      color: var(--ink-secondary);
      margin-left: auto;
    }

    /* Definition grid — label/value pairs */
    .detail-grid {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 16px 24px;
      align-items: start;
    }

    dt {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-secondary);
      white-space: normal;
      line-height: 1.35;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    dd {
      font-size: 16px;
      color: var(--ink);
      font-weight: 400;
      line-height: 1.5;
    }


    dd.ta-font { font-family: var(--font-ta); }

    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Tags: 1px border, 4px radius, no fill */
    .dtag {
      font-size: 14px;
      font-weight: 400;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0 8px;
      border-radius: 4px;
      line-height: 1.5;
    }

    .none-text {
      font-size: 14px;
      font-weight: 400;
      color: var(--ink-secondary);
    }

    /* Section divider */
    .detail-section-sep {
      border: none;
      border-top: 1px solid var(--border);
    }

    /* Transcript block: Editorial quote treatment —
       No card, no rounded container. 3px solid left-border accent strip,
       text sitting directly on the page background. */
    .transcript-block {
      background: transparent;
      border: none;
      border-left: 3px solid var(--accent);
      border-radius: 0px;
      padding: 0 0 0 16px;
    }

    .transcript-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .transcript-text {
      font-size: 16px;
      font-weight: 400;
      color: var(--ink);
      font-family: var(--font-ta);
      line-height: 1.5;
    }

    /* JSON details */
    .json-details {
      font-size: 14px;
      color: var(--ink-secondary);
    }

    summary {
      cursor: pointer;
      color: var(--accent);
      font-weight: 600;
      font-size: 14px;
      padding: 8px 0;
      list-style: none;
      outline: none;
      user-select: none;
    }

    summary::before {
      content: '▶  ';
      font-size: 14px;
    }

    details[open] summary::before { content: '▼  '; }
    summary:hover { color: var(--accent); }

    pre {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 4px;
      font-size: 14px;
      overflow-x: auto;
      margin-top: 8px;
      line-height: 1.5;
    }

    .ta-font { font-family: var(--font-ta) !important; }
  </style>
</head>
<body>
  <div class="records-app">

    <!-- Flat header — matches kiosk exactly -->
    <header class="phc-bar">
      <div class="phc-brand">
        <div class="phc-emblem" aria-label="Medical Cross">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4v16m-8-8h16"/>
          </svg>
        </div>
        <div class="phc-brand-text">
          <span class="brand-title ta-font">ஆரம்ப சுகாதார நிலையம் · Intake Records</span>
          <span class="brand-sub">Primary Health Centre · Live outpatient check-in log</span>
        </div>
      </div>
      <div class="header-controls">
        <div class="live-indicator">
          <span id="pollingIndicator" class="pulse-dot"></span>
          <span id="pollingLabel">Live</span>
        </div>
        <span id="recordCountBadge" class="record-count">0</span>
        <a href="/" class="btn-nav">Open Kiosk</a>
      </div>
    </header>

    <!-- Two-column list-detail workspace -->
    <div class="records-workspace">

      <!-- Left: compact token list -->
      <aside class="token-list-panel">
        <div class="list-panel-header">
          <span class="list-panel-title">Patients</span>
          <span id="listCountChip" class="list-count-chip">0</span>
        </div>
        <div id="tokenList" class="token-list">
          <div class="list-empty">Waiting for next patient...</div>
        </div>
      </aside>

      <!-- Right: detail panel -->
      <main id="detailPanel" class="detail-panel">
        <div class="detail-empty-state">
          <p>No record selected</p>
        </div>
      </main>

    </div>
  </div>

  <script>
    const tokenList        = document.getElementById('tokenList');
    const detailPanel      = document.getElementById('detailPanel');
    const recordCountBadge = document.getElementById('recordCountBadge');
    const listCountChip    = document.getElementById('listCountChip');
    const pollingIndicator = document.getElementById('pollingIndicator');
    const pollingLabel     = document.getElementById('pollingLabel');

    let selectedKey    = null;
    let currentRecords = [];

    // ── Helpers ──

    function escapeHtml(str) {
      if (str == null) return '';
      const d = document.createElement('div');
      d.textContent = String(str);
      return d.innerHTML;
    }

    function getRecordKey(entry, idx) {
      const item = entry.intake_result || {};
      return item.patient_id ? String(item.patient_id) : (entry.timestamp || `rec-${idx}`);
    }

    function confClass(level) {
      if (level === 'high')   return 'conf-high';
      if (level === 'medium') return 'conf-medium';
      return 'conf-low';
    }

    function confText(level) {
      if (level === 'high')   return 'HIGH';
      if (level === 'medium') return 'MED';
      return 'LOW';
    }

    function fmtTime(ts) {
      if (!ts) return '';
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // ── Detail renderer ──

    function renderDetail(entry) {
      const item = entry.intake_result || {};
      const level = item.input_confidence || 'low';
      const symptoms = Array.isArray(item.symptoms) ? item.symptoms : [];
      const conditions = Array.isArray(item.known_conditions) ? item.known_conditions : [];
      const fuEntries = item.follow_up_answers && typeof item.follow_up_answers === 'object'
        ? Object.entries(item.follow_up_answers).filter(([, v]) => v != null && String(v).trim())
        : [];

      const sympHtml = symptoms.length
        ? `<div class="detail-tags">${symptoms.map(s => `<span class="dtag">${escapeHtml(s)}</span>`).join('')}</div>`
        : `<span class="none-text">None identified</span>`;

      const condHtml = conditions.length
        ? `<dt>Conditions</dt><dd><div class="detail-tags">${conditions.map(c => `<span class="dtag">${escapeHtml(c)}</span>`).join('')}</div></dd>`
        : '';

      const fuHtml = fuEntries.map(([cat, ans]) => {
        const cleanLabel = String(cat).replace(/_/g, ' ');
        return `<dt>${escapeHtml(cleanLabel)}</dt><dd class="ta-font">${escapeHtml(String(ans))}</dd>`;
      }).join('');


      detailPanel.innerHTML = `
        <div class="detail-content">

          <div class="detail-header">
            <h2 class="detail-token">Token #${escapeHtml(item.patient_id || '—')}</h2>
            <span class="conf-label ${confClass(level)}">
              <span class="conf-dot"></span>${confText(level)}
            </span>
            <span class="detail-timestamp">${escapeHtml(fmtTime(entry.timestamp))}</span>
          </div>

          <dl class="detail-grid">
            <dt>Chief Complaint</dt>
            <dd>${escapeHtml(item.chief_complaint || '—')}</dd>

            <dt>Duration</dt>
            <dd>${escapeHtml(item.duration || '—')}</dd>

            <dt>Age</dt>
            <dd>${item.age != null ? escapeHtml(String(item.age)) + ' yrs' : '—'}</dd>

            <dt>Symptoms</dt>
            <dd>${sympHtml}</dd>

            ${condHtml}
            ${fuHtml}
          </dl>

          <hr class="detail-section-sep">

          <div class="transcript-block">
            <span class="transcript-label">Raw Transcript</span>
            <p class="transcript-text">${escapeHtml(item.raw_transcript || '')}</p>
          </div>

          <details class="json-details">
            <summary>Full IntakeResult JSON</summary>
            <pre>${escapeHtml(JSON.stringify(item, null, 2))}</pre>
          </details>

        </div>
      `;
    }

    // ── Token row ──

    function createTokenRow(entry, recordKey) {
      const item = entry.intake_result || {};
      const level = item.input_confidence || 'low';
      const complaint = item.chief_complaint || '—';
      const truncated = complaint.length > 32 ? complaint.slice(0, 32) + '…' : complaint;

      const btn = document.createElement('button');
      btn.className = `token-row ${confClass(level)}`;
      btn.setAttribute('data-key', recordKey);
      btn.innerHTML = `
        <span class="row-id">#${escapeHtml(item.patient_id || '?')}</span>
        <span class="row-time">${escapeHtml(fmtTime(entry.timestamp))}</span>
        <span class="row-complaint">${escapeHtml(truncated)}</span>
      `;
      btn.addEventListener('click', () => selectRecord(recordKey));
      return btn;
    }

    // ── Selection ──

    function selectRecord(recordKey) {
      selectedKey = recordKey;
      tokenList.querySelectorAll('.token-row').forEach(r => {
        r.classList.toggle('selected', r.getAttribute('data-key') === recordKey);
      });
      const entry = currentRecords.find((e, i) => getRecordKey(e, i) === recordKey);
      if (entry) renderDetail(entry);
    }

    // ── Full DOM update on fetch ──

    function updateRecordsDOM(records) {
      currentRecords = records;
      const count = records ? records.length : 0;
      recordCountBadge.textContent = String(count);
      listCountChip.textContent    = String(count);

      if (!count) {
        tokenList.innerHTML  = '<div class="list-empty">Waiting for next patient...</div>';
        detailPanel.innerHTML = '<div class="detail-empty-state"><p>No record selected</p></div>';
        selectedKey = null;
        return;
      }

      // Hash-gated rebuild to avoid disrupting scroll position unnecessarily
      const newHash = JSON.stringify(records.map(e => e.intake_result));
      if (tokenList.dataset.hash === newHash) return;
      tokenList.dataset.hash = newHash;

      // Rebuild list — newest first (reverse the server order)
      tokenList.innerHTML = '';
      [...records].reverse().forEach((entry, idx) => {
        const key = getRecordKey(entry, records.length - 1 - idx);
        const row = createTokenRow(entry, key);
        tokenList.appendChild(row);
      });

      // Restore selection or auto-select most recent
      if (selectedKey) {
        const selRow = tokenList.querySelector(`[data-key="${CSS.escape(selectedKey)}"]`);
        if (selRow) {
          selRow.classList.add('selected');
          // Re-render detail in case data changed
          const entry = currentRecords.find((e, i) => getRecordKey(e, i) === selectedKey);
          if (entry) renderDetail(entry);
        } else {
          // Selected record gone — clear and auto-select first
          selectedKey = null;
        }
      }

      if (!selectedKey && records.length > 0) {
        // Auto-select the most recent (first in reversed list)
        const firstRow = tokenList.querySelector('.token-row');
        if (firstRow) {
          const key = firstRow.getAttribute('data-key');
          selectRecord(key);
        }
      }
    }

    // ── Live polling ──

    async function fetchRecords() {
      try {
        const res = await fetch('/intake/records');
        if (!res.ok) return;
        const data = await res.json();
        updateRecordsDOM(data);
        pollingIndicator.className = 'pulse-dot';
        pollingLabel.textContent   = 'Live';
      } catch (e) {
        pollingIndicator.className = 'pulse-dot paused';
        pollingLabel.textContent   = 'Offline';
        console.warn('Records fetch failed:', e);
      }
    }

    fetchRecords();
    setInterval(fetchRecords, 3000);
  </script>
</body>
</html>
